[pytest]
DJANGO_SETTINGS_MODULE = {{cookiecutter.project_module}}.config.settings
python_files = tests.py test_*.py *_tests.py
testpaths=tests
addopts =
    -m "not selenium"
    --reuse-db
    --cov-report=html
    --cov-config=tests/.coveragerc
    --cov={{cookiecutter.project_module}}
markers =
    selenium: integration tests using Selenium
