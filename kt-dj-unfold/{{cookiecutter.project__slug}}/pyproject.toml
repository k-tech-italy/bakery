[build-system]
build-backend = "hatchling.build"
requires = [
  "hatch-vcs>=0.4",
  "hatchling>=1.25",
]

[project]
name = "{{cookiecutter.project_slug}}"
version = "0.1.0"
description = "{{cookiecutter.project__name}}"
readme = "README.md"
requires-python = ">=3.13"
authors = [
  {name = "K-Tech s.r.l.", email = "info@k-tech.it"}
]
maintainers = [
  {name = "Giovanni Bronzini", email = "g.bronzini@gmail.com"},
]
license-files = ["LICEN[CS]E*"]
classifiers = [
    # How mature is this project? Common values are
    #   3 - Alpha
    #   4 - Beta
    #   5 - Production/Stable
    "Development Status :: 4 - Beta",

    # Indicate who your project is intended for
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Build Tools",

    # Specify the Python versions you support here.
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: Django :: 5.2"
]

dependencies = [
    "django-click>=2.4.1",
    "django-constance>=4.3.2",
    "django-cors-headers>=4.7.0",
    "django-crispy-forms>=2.5",
    "django-debug-toolbar>=5.1.0",
    "django-extensions>=4.1",
    "django-flags>=5.0.13",
    "django-regex>=0.5.0",
    "django-smart-env>=0.1.0",
    "django-unfold>=0.76.0",
    "django>=5.2",
    "psycopg[binary]>=3.2.6",
    "sentry-sdk>=2.26.1",
]

[dependency-groups]
dev = [
    "pre-commit>=4.2.0",
    "pytest>=8.3.5",
    "pytest-coverage>=0.0",
    "pytest-django>=4.11.1",
    "pytest-echo>=2.0",
    "tox>=4.25.0",
    "detect-secrets>=1.5.0",
    "django-tailwind[reload]>=4.0.1",
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.0.0",
]
image = [
    "circus>=0.19.0",
]




[tool.hatch]
build.hooks.vcs.version-file = "src/{{cookiecutter.project__module}}/version.py"
version.source = "vcs"
raw-options = { root = "../.." }
artifacts = [
    "*.mo",
]

[tool.hatch.version.raw-options]
local_scheme = "no-local-version"

[tool.hatch.build.targets.sdist]
ignore-vcs = true
only-include = [ "src/{{cookiecutter.project__module}}" ]

[tool.hatch.build.targets.wheel]
ignore-vcs = true
packages = [ "src/{{cookiecutter.project__module}}" ]
