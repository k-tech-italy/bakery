[build-system]
build-backend = "hatchling.build"
requires = [
  "hatch-vcs>=0.4",
  "hatchling>=1.25",
]

[project]
name = "{{cookiecutter.project__slug}}"
description = "{{cookiecutter.project__name}}"
readme = "README.md"
requires-python = ">=3.13"
authors = [
  {name = "K-Tech s.r.l.", email = "info@k-tech.it"}
]
maintainers = [
  {name = "Giovanni Bronzini", email = "g.bronzini@gmail.com"},
]
license-files = ["LICEN[CS]E*"]
classifiers = [
    # How mature is this project? Common values are
    #   3 - Alpha
    #   4 - Beta
    #   5 - Production/Stable
    "Development Status :: 4 - Beta",

    # Indicate who your project is intended for
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Build Tools",

    # Specify the Python versions you support here.
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Framework :: Django :: 5.2"
]
dynamic = [ "version" ]

dependencies = [
    "django-click>=2.4.1",
    "django-constance>=4.3.2",
    "django-cors-headers>=4.7.0",
    "django-crispy-forms>=2.5",
    "django-debug-toolbar>=5.1.0",
    "django-extensions>=4.1",
    "django-flags>=5.0.13",
    "django-regex>=0.5.0",
    "django-smart-env>=0.1.0",
    "django-unfold>=0.76.0",
    "django>=5.2",
    "psycopg[binary]>=3.2.6",
    "sentry-sdk>=2.26.1",
]

[dependency-groups]
dev = [
    "pre-commit>=4.2.0",
    "detect-secrets>=1.5.0",
]
test = [
  "factory-boy>=3.3.3",
  "freezegun>=1.5.5",
  "pytest>=8.3.3",
  "pytest-cov>=5",
  "pytest-echo>=2.0",
  "pytest-django>=4.11.1",
  "pytest-randomly>=3.16",
  "responses",
  "tox>=4.25",
]
docs = [
  "mkdocs>=1.5.3",
  "mkdocs-awesome-pages-plugin>=2.9.3",
  "mkdocs-click>=0.8.1",
  "mkdocs-ezglossary-plugin>=1.6.10",
  "mkdocs-ezlinks-plugin>=0.1.14",
  "mkdocs-gen-files>=0.5",
  "mkdocs-get-deps>=0.2",
  "mkdocs-include-markdown-plugin>=6.2.2",
  "mkdocs-link-marker>=0.1.3",
  "mkdocs-macros-plugin>=1.0.5",
  "mkdocs-material[imaging]>=9.5.15",
  "mkdocs-minify-plugin",
  "mkdocs-redirects",
  "mkdocs-simple-hooks>=0.1.5",
  "mkdocstrings[python]>=0.24.1",
  "pymdown-extensions>=10.7.1",
]
image = [
    "circus>=0.19.0",
]




[tool.hatch]
build.hooks.vcs.version-file = "src/{{cookiecutter.project__module}}/version.py"
version.source = "vcs"
raw-options = { root = "../.." }
artifacts = [
    "*.mo",
]

[tool.hatch.version.raw-options]
local_scheme = "no-local-version"

[tool.hatch.build.targets.sdist]
ignore-vcs = true
only-include = [ "src/{{cookiecutter.project__module}}" ]

[tool.hatch.build.targets.wheel]
ignore-vcs = true
packages = [ "src/{{cookiecutter.project__module}}" ]

[tool.uv]
default-groups = [ "dev", "test", "docs" ]
package = true