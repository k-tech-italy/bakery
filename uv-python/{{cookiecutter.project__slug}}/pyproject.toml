[build-system]
build-backend = "hatchling.build"
requires = [
  "hatch-vcs>=0.4",
  "hatchling>=1.25",
]

[project]
name = "{{cookiecutter.project__slug}}"
version = "0.1.0"
description = "{{cookiecutter.project__name}}"
authors = [
    {name = "K-Tech", email = "info@k-tech.it"},
]
readme = "README.md"
requires-python = ">={{cookiecutter.python__version}}"
dependencies = [
    "click>=8.1.8",
]

[project.scripts]
{{ cookiecutter.click__command }} = "{{ cookiecutter.project__module }}.cli:main"


[dependency-groups]
dev = [
    "pytest>=8.3.3",
    "pre-commit>=4.0.1",
]

{% if cookiecutter.mkdocs %}
docs = [
    "cairosvg>=2.7.1",
    "markupsafe>=3.0.2",
    "mdx-gh-links>=0.4",
    "mkdocs>=1.6.1",
    "mkdocs-autolinks-plugin>=0.7.1",
    "mkdocs-awesome-pages-plugin>=2.10.1",
    "mkdocs-click>=0.8.1",
    "mkdocs-embed-external-markdown>=3.0.2",
    "mkdocs-ezglossary-plugin>=1.7.1",
    "mkdocs-gen-files>=0.5.0",
    "mkdocs-get-deps>=0.2.0",
    "mkdocs-include-markdown-plugin>=7.1.2",
    "mkdocs-link-marker>=0.1.3",
    "mkdocs-macros-plugin>=1.3.7",
    "mkdocs-material>=9.5.49",
    "mkdocs-minify-plugin>=0.8.0",
    "mkdocs-redirects>=1.2.2",
    "mkdocs-simple-hooks>=0.1.5",
    "mkdocstrings[python]>=0.27.0",
    "pymarkdown>=0.1.4",
    "pymdown-extensions>=10.14",
]
{% endif %}

{% if cookiecutter.exe_builder %}
exe_builder = [
    "pyinstaller>=6.11.0",
]
{% endif %}

[tool.uv]
default-groups = ["dev"{% if cookiecutter.exe_builder %}, "exe_builder"{% endif %}{% if cookiecutter.mkdocs %}, "docs"{% endif %}]

[tool.ruff]
line-length = 120
indent-width = 4


[tool.hatch]
build.hooks.vcs.version-file = "src/{{ cookiecutter.project__module }}/version.py"
version.source = "vcs"
raw-options = { root = "../.." }
artifacts = [
    "*.mo",
]

[tool.hatch.version.raw-options]
local_scheme = "no-local-version"

[tool.hatch.build.targets.sdist]
ignore-vcs = true
only-include = [ "src/{{ cookiecutter.project__module }}" ]

[tool.hatch.build.targets.wheel]
ignore-vcs = true
packages = [ "src/{{ cookiecutter.project__module }}" ]
