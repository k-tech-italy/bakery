services:

  db:
    image: postgres:{{ cookiecutter.postgres_version }}-alpine
    env_file: .env-docker
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-{{ cookiecutter.package_name }}}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-{{ cookiecutter.package_name }}}
      POSTGRES_DB: ${POSTGRES_DB:-{{ cookiecutter.package_name }}}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-{{ cookiecutter.package_name }}} -d ${POSTGRES_DB:-{{ cookiecutter.package_name }}}"]
      interval: 10s
      timeout: 5s
      retries: 5
  {% if cookiecutter.use_celery == "yes" %}
  redis:
    image: redis:{{ cookiecutter.redis_version }}-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
  {% endif %}
  app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    image: {{ cookiecutter.project_slug }}-app:latest
    command: ["web"]
    env_file: .env-docker
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER:-{{ cookiecutter.package_name }}}:${POSTGRES_PASSWORD:-{{ cookiecutter.package_name }}}@db:5432/${POSTGRES_DB:-{{ cookiecutter.package_name }}}"
      STATIC_URL: "/static/"
      MEDIA_URL: "/media/"
      STATIC_ROOT: "/app/staticfiles"
      MEDIA_ROOT: "/app/media"
    networks:
      default:
        aliases:
          - {{ cookiecutter.project_slug }}-app
    volumes:
      - static-files:/app/staticfiles
      - media-files:/app/media
      - url-prefixes:/shared
    depends_on:
      db:
        condition: service_healthy
      {% if cookiecutter.use_celery == "yes" %}redis:
        condition: service_healthy
      {% endif %}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; s=socket.socket(); s.connect(('127.0.0.1', 8000)); s.close()\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
  {% if cookiecutter.use_celery == "yes" %}
  celery:
    image: {{ cookiecutter.project_slug }}-app:latest
    command: ["worker"]
    env_file: .env-docker
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER:-{{ cookiecutter.package_name }}}:${POSTGRES_PASSWORD:-{{ cookiecutter.package_name }}}@db:5432/${POSTGRES_DB:-{{ cookiecutter.package_name }}}"
      MEDIA_ROOT: "/app/media"
    volumes:
      - media-files:/app/media
    depends_on:
      app:
        condition: service_healthy
      redis:
        condition: service_healthy
  {% endif %}
  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    ports:
      - "${NGINX_PORT:-80}:80"
    environment:
      APP_UPSTREAM: {{ cookiecutter.project_slug }}-app:8000
    volumes:
      - static-files:/var/www/static:ro
      - media-files:/var/www/media:ro
      - url-prefixes:/shared:ro
    depends_on:
      app:
        condition: service_healthy

volumes:
  db-data:
  static-files:
  media-files:
  url-prefixes: