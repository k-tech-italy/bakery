name: 'Docker'

on:
  push:
    branches:
      - develop
      - main
      - feature/*
      - bugfix/*
  pull_request:
    branches:
      - main

concurrency:
  group: "${{ '{{' }} github.workflow {{ '}}' }}-${{ '{{' }} github.ref {{ '}}' }}"
  cancel-in-progress: true

jobs:
  build-and-scan:
    name: 'Build & Scan (${{ '{{' }} matrix.name {{ '}}' }})'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: app
            dockerfile: docker/app/Dockerfile
            scope: app
          - name: nginx
            dockerfile: docker/nginx/Dockerfile
            scope: nginx
    steps:
      - name: 'Check out repository code'
        uses: actions/checkout@v4
      - name: 'Set up Docker Buildx'
        uses: docker/setup-buildx-action@v3
      - name: 'Build image'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/${{ '{{' }} matrix.name {{ '}}' }}/Dockerfile
          push: false
          load: true
          tags: {{ cookiecutter.project_slug }}-${{ '{{' }} matrix.name {{ '}}' }}:${{ '{{' }} github.sha {{ '}}' }}
          cache-from: type=gha,scope=${{ '{{' }} matrix.scope {{ '}}' }}
          cache-to: type=gha,mode=max,scope=${{ '{{' }} matrix.scope {{ '}}' }}
      {% if cookiecutter.use_trivy == "yes" %}
      - name: 'Install Trivy'
        run: |
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key \
            | gpg --dearmor \
            | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" \
            | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update -qq && sudo apt-get install -y trivy
      - name: 'Report vulnerabilities'
        run: |
          trivy image --quiet --severity HIGH,CRITICAL --format table \
            {{ cookiecutter.project_slug }}-${{ '{{' }} matrix.name {{ '}}' }}:${{ '{{' }} github.sha {{ '}}' }} || true
      - name: 'Gate on vulnerabilities'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: {{ cookiecutter.project_slug }}-${{ '{{' }} matrix.name {{ '}}' }}:${{ '{{' }} github.sha {{ '}}' }}
          format: sarif
          output: trivy-${{ '{{' }} matrix.name {{ '}}' }}.sarif
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: 'true'
          trivyignores: .trivyignore
          limit-severities-for-sarif: 'true'
          skip-setup-trivy: true
          hide-progress: 'true'
      - name: 'Upload scan results to GitHub Security'
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        continue-on-error: true
        with:
          sarif_file: trivy-${{ '{{' }} matrix.name {{ '}}' }}.sarif
          category: docker-${{ '{{' }} matrix.name {{ '}}' }}
      {% endif %}

  publish:
    name: 'Publish Images'
    needs: [build-and-scan]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: app
            dockerfile: docker/app/Dockerfile
            scope: app
          - name: nginx
            dockerfile: docker/nginx/Dockerfile
            scope: nginx
    steps:
      - name: 'Check out repository code'
        uses: actions/checkout@v4
      - name: 'Set up Docker Buildx'
        uses: docker/setup-buildx-action@v3
      - name: 'Log in to registry'
        uses: docker/login-action@v3
        with:
          registry: ${{ '{{' }} secrets.REGISTRY {{ '}}' }}
          username: ${{ '{{' }} secrets.REGISTRY_USERNAME {{ '}}' }}
          password: ${{ '{{' }} secrets.REGISTRY_PASSWORD {{ '}}' }}
      - name: 'Extract image metadata'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ '{{' }} secrets.REGISTRY {{ '}}' }}/{{ cookiecutter.project_slug }}-${{ '{{' }} matrix.name {{ '}}' }}
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable=${{ '{{' }} github.ref == 'refs/heads/main' {{ '}}' }}
            type=raw,value=staging,enable=${{ '{{' }} github.ref == 'refs/heads/develop' {{ '}}' }}
      - name: 'Build and push'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/${{ '{{' }} matrix.name {{ '}}' }}/Dockerfile
          push: true
          tags: ${{ '{{' }} steps.meta.outputs.tags {{ '}}' }}
          labels: ${{ '{{' }} steps.meta.outputs.labels {{ '}}' }}
          cache-from: type=gha,scope=${{ '{{' }} matrix.scope {{ '}}' }}
          cache-to: type=gha,mode=max,scope=${{ '{{' }} matrix.scope {{ '}}' }}