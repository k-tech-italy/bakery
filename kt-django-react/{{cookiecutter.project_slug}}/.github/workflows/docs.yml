name: 'Documentation'

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - docs/**
      - .github/workflows/docs.yml

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  generate:
    name: 'Generate docs'
    runs-on: ubuntu-latest
    steps:
      - name: 'Check out repository code'
        uses: actions/checkout@v4
      - name: 'Install uv'
        uses: astral-sh/setup-uv@v6
        with:
          version: latest
          enable-cache: true
          prune-cache: false
          cache-local-path: ./uv-cache
          cache-dependency-glob: |
            **/pyproject.toml
            **/uv.lock
      - name: 'Restore cached env'
        id: cache-env-restore
        uses: actions/cache/restore@v4
        with:
          path: ./uv-cache
          key: ${{ '{{' }} runner.os {{ '}}' }}-venv-docs
      - name: 'Install dependencies'
        run: uv sync --cache-dir ./uv-cache --frozen --group docs
      - name: 'Save updated env'
        uses: actions/cache/save@v4
        with:
          path: ./uv-cache
          key: ${{ '{{' }} steps.cache-env-restore.outputs.cache-primary-key {{ '}}' }}
      - name: 'Build docs'
        run: uv run mkdocs build -d ./docs-output
      - name: 'Upload artifact'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs-output

  deploy:
    name: 'Deploy docs'
    environment:
      name: github-pages
      url: ${{ '{{' }} steps.deployment.outputs.page_url {{ '}}' }}
    runs-on: ubuntu-latest
    needs: generate
    steps:
      - name: 'Deploy to GitHub Pages'
        id: deployment
        uses: actions/deploy-pages@v4